[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctum-local"
version = "0.1.0"
description = "Local text redaction gateway and prompt guard for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sanctum = "sanctum.cli:main"

[tool.setuptools]
packages = ["sanctum"]
