[package]
name = "sanctum"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Local text privacy gateway and native Codex plugin companion"
publish = false
default-run = "sanctum"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chacha20poly1305 = "0.10.1"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4.3"
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
regex = "1.12"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util", "io-std"] }
tokio-stream = "0.1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
