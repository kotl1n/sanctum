name: Проверка релиза
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --jobs 2 -- -D warnings
      - run: cargo test --locked --all-targets --jobs 2
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/composer-host.test.cjs
      - run: node --check ui/composer.js && node --check ui/composer-host.cjs
      - run: python3 -c "import ast; from pathlib import Path; [ast.parse(p.read_text(), filename=str(p)) for root in ('scripts', 'tests', 'plugins') for p in Path(root).rglob('*.py')]"
      - run: python3 scripts/build_release.py --jobs 2
  msrv:
    name: Минимальная версия Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-targets --jobs 2
  native:
    name: Проверка нативного патча
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/build_native_backend.py --prepare-only
